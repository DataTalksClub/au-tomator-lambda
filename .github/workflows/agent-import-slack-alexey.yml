name: Agent import slack-alexey
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::387546586013:role/automator-lambda-deploy
          aws-region: eu-west-1
      - name: auth.test scopes + try DM export APIs
        run: |
          set -euo pipefail
          umask 077
          aws lambda get-function \
            --function-name automator-process-reaction \
            --query 'Configuration.Environment.Variables' \
            --output json > /tmp/env.json
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          env=json.load(open("/tmp/env.json"))
          user=env["USER_SLACK_TOKEN"]
          bot=env["SLACK_TOKEN"]
          def call(token, method, payload=None, http="GET"):
            if http=="GET":
              url="https://slack.com/api/"+method
              if payload:
                url+="?"+urllib.parse.urlencode(payload)
              req=urllib.request.Request(url, headers={"Authorization":"Bearer "+token})
            else:
              data=urllib.parse.urlencode(payload or {}).encode()
              req=urllib.request.Request("https://slack.com/api/"+method, data=data,
                headers={"Authorization":"Bearer "+token, "Content-Type":"application/x-www-form-urlencoded"})
            return json.load(urllib.request.urlopen(req, timeout=60))
          for label,tok in [("user",user),("bot",bot)]:
            info=call(tok,"auth.test")
            print(label, "ok", info.get("ok"), "user", info.get("user"), "user_id", info.get("user_id"), "team", info.get("team"))
            # scopes header isn't in JSON; use apps.permissions.info if available
          # Try conversations.list im for user
          for method,payload in [
            ("conversations.list", {"types":"im","limit":"5"}),
            ("conversations.open", {"users":"U01PAASPXHU"}),
            ("users.info", {"user":"U01PAASPXHU"}),
            ("search.messages", {"query":"from:<@U01PAASPXHU>","count":"1"}),
          ]:
            data=call(user, method, payload, http="POST" if method in ("conversations.open",) else "GET")
            # conversations.open needs POST
            print("user", method, "ok", data.get("ok"), "error", data.get("error"),
                  "channel" , (data.get("channel") or {}).get("id") if isinstance(data.get("channel"),dict) else data.get("channel"))
          # Also try bot conversations.open (won't work for private DM usually)
          data=call(bot,"conversations.open",{"users":"U01PAASPXHU"}, http="POST")
          print("bot conversations.open", data.get("ok"), data.get("error"))
          PY
          shred -u /tmp/env.json 2>/dev/null || rm -f /tmp/env.json
