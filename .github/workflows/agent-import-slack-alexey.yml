name: Agent import slack-alexey
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::387546586013:role/automator-lambda-deploy
          aws-region: eu-west-1
      - name: Export Mikhail DM via search.messages
        run: |
          set -euo pipefail
          umask 077
          aws lambda get-function \
            --function-name automator-process-reaction \
            --query 'Configuration.Environment.Variables.USER_SLACK_TOKEN' \
            --output text > /tmp/slack-token
          python3 - <<'PY'
          import json,urllib.request,urllib.parse,time
          token=open("/tmp/slack-token").read().strip()
          user_id="U01PAASPXHU"
          alexey="U01AXE0P5M3"
          def search(query, page=1):
            payload={"query":query,"count":100,"page":page,"sort":"timestamp","sort_dir":"desc"}
            data=urllib.parse.urlencode(payload).encode()
            req=urllib.request.Request(
              "https://slack.com/api/search.messages", data=data,
              headers={"Authorization":"Bearer "+token,
                       "Content-Type":"application/x-www-form-urlencoded"})
            return json.load(urllib.request.urlopen(req, timeout=60))
          # Collect from multiple query shapes that hit the 1:1 DM
          queries=[
            f"in:<@{user_id}>",
            f"from:<@{user_id}>",
            f"to:<@{user_id}>",
          ]
          by_ts={}
          meta={"queries":{}, "user_id": user_id, "connection":"slack-alexey"}
          for q in queries:
            total=0
            for page in range(1, 4):
              data=search(q, page=page)
              if not data.get("ok"):
                meta["queries"][q]={"ok":False,"error":data.get("error")}
                break
              matches=data.get("messages") or {}
              total=matches.get("total") or total
              for m in matches.get("matches") or []:
                ts=m.get("ts")
                if not ts: continue
                ch=m.get("channel") or {}
                by_ts[ts]={
                  "ts": ts,
                  "user": m.get("user"),
                  "username": m.get("username"),
                  "text": m.get("text") or "",
                  "channel_id": ch.get("id"),
                  "channel_name": ch.get("name"),
                  "channel_type": "im" if ch.get("is_im") else ch.get("type") or ("im" if str(ch.get("id") or "").startswith("D") else None),
                  "permalink": m.get("permalink"),
                  "iid": m.get("iid"),
                }
              paging=matches.get("pagination") or {}
              if page >= int(paging.get("page_count") or 1):
                break
              time.sleep(0.3)
            meta["queries"][q]={"ok":True,"total":total,"collected":len(by_ts)}
          messages=sorted(by_ts.values(), key=lambda m: float(m["ts"]), reverse=True)[:200]
          # Prefer an IM channel id if present
          channel=None
          for m in messages:
            if m.get("channel_id") and str(m["channel_id"]).startswith("D"):
              channel=m["channel_id"]; break
          out={
            "connection": "slack-alexey",
            "user_id": user_id,
            "user_name": "Mikhail Rozhkov",
            "user_handle": "mnrozhkov",
            "channel": channel,
            "channel_type": "im",
            "export_method": "search.messages",
            "messages": [
              {"ts":m["ts"],"user":m["user"],"type":"message","subtype":None,
               "text":m["text"],"thread_ts":None,
               "permalink":m.get("permalink")}
              for m in messages
            ],
            "count": len(messages),
            "next_cursor": None,
            "meta": meta,
          }
          open("/tmp/export.json","w").write(json.dumps(out, ensure_ascii=False, indent=2))
          print("export_count", out["count"], "channel", channel, "query_meta", json.dumps(meta["queries"]))
          PY
          shred -u /tmp/slack-token 2>/dev/null || rm -f /tmp/slack-token
      - name: Upload export
        uses: actions/upload-artifact@v4
        with:
          name: mikhail-rozhkov-slack-dm
          path: /tmp/export.json
          retention-days: 1
