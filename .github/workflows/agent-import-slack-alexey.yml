name: Agent import slack-alexey
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "import or find-user"
        default: "find-user"
        required: true
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::387546586013:role/automator-lambda-deploy
          aws-region: eu-west-1
      - name: Find Mikhail via bot token scopes
        env:
          DAPIER_TOKEN: ${{ secrets.DAPIER_OPERATOR_TOKEN }}
          DAPIER_API_URL: https://dapier.dtcdev.click
        run: |
          set -euo pipefail
          umask 077
          aws lambda get-function \
            --function-name automator-process-reaction \
            --query 'Configuration.Environment.Variables' \
            --output json > /tmp/env.json
          python3 - <<'PY'
          import json,urllib.request,urllib.parse,os,re
          env=json.load(open("/tmp/env.json"))
          print("env_keys", sorted(env.keys()))
          bot=env.get("SLACK_BOT_TOKEN") or env.get("BOT_SLACK_TOKEN") or env.get("SLACK_TOKEN")
          user=env.get("USER_SLACK_TOKEN")
          print("has_bot", bool(bot), "has_user", bool(user))
          if bot:
            print("bot_prefix", bot[:5])
          # Prefer bot for users.list; fall back to user
          token = bot or user
          assert token, "no slack token"
          cursor=None
          found=[]
          pages=0
          while pages < 50:
            pages += 1
            qs={"limit":200}
            if cursor: qs["cursor"]=cursor
            req=urllib.request.Request(
              "https://slack.com/api/users.list?"+urllib.parse.urlencode(qs),
              headers={"Authorization":"Bearer "+token})
            data=json.load(urllib.request.urlopen(req, timeout=60))
            if not data.get("ok"):
              print("users.list_error", data.get("error"))
              break
            for m in data.get("members") or []:
              prof=m.get("profile") or {}
              blob=" ".join([
                str(m.get("id") or ""),
                str(m.get("name") or ""),
                str(prof.get("real_name") or ""),
                str(prof.get("display_name") or ""),
                str(prof.get("email") or ""),
              ]).lower()
              if "rozhkov" in blob or ("mikhail" in blob and "rozh" in blob):
                found.append({
                  "id": m.get("id"),
                  "name": prof.get("real_name") or m.get("name"),
                  "handle": m.get("name"),
                  "email": prof.get("email"),
                })
            cursor=(data.get("response_metadata") or {}).get("next_cursor") or None
            if not cursor:
              break
          print("pages", pages, "matches", json.dumps(found, ensure_ascii=False))
          PY
          shred -u /tmp/env.json 2>/dev/null || rm -f /tmp/env.json
