name: Deploy Automator

on:
  workflow_run:
    workflows: ["Test Automator"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      live_proof:
        description: 'Post a labelled CMP integration test thread in the ML course channel'
        type: boolean
        default: false
      proof_thread_ts:
        description: 'Existing ML test thread to inspect instead of posting a new question'
        type: string
        default: ''

env:
  AWS_REGION: eu-west-1
  FUNCTION_NAME: automator-process-reaction
  DEPLOY_ROLE_ARN: arn:aws:iam::387546586013:role/automator-lambda-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # request the OIDC token for AWS role assumption
      contents: read
    # Deploy only when Test Automator passed on main, or when manually run from main.
    if: (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    defaults:
      run:
        working-directory: automator
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.12'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Package Lambda function
      run: bash scripts/package.sh

    - name: Validate audit and CMP configuration
      env:
        MOD_AUDIT_ENABLED: 'true'
        MOD_API_URL: https://mod.dtcdev.click
        MOD_API_TOKEN: ${{ secrets.MOD_API_TOKEN }}
        CMP_BOT_READ_TOKEN: ${{ secrets.CMP_BOT_READ_TOKEN }}
        CMP_SLACK_TEAM_ID: ${{ vars.CMP_SLACK_TEAM_ID }}
      run: |
        umask 077
        audit_env=$(mktemp)
        trap 'rm -f "$audit_env"' EXIT
        aws lambda get-function-configuration \
          --function-name "$FUNCTION_NAME" --region "$AWS_REGION" \
          --query 'Environment.Variables' --output json | \
          PYTHONPATH=src uv run python scripts/check_audit_config.py --merge | \
          uv run python scripts/merge_cmp_config.py > "$audit_env"
        aws lambda update-function-configuration \
          --function-name "$FUNCTION_NAME" --region "$AWS_REGION" \
          --timeout 120 \
          --environment "file://$audit_env" --query 'LastUpdateStatus' --output text
        aws lambda wait function-updated --function-name "$FUNCTION_NAME" --region "$AWS_REGION"

    - name: Deploy to AWS Lambda
      run: bash scripts/deploy.sh

    - name: Verify deployment
      run: |
        aws lambda wait function-updated --function-name "$FUNCTION_NAME" --region "$AWS_REGION"
        expected_sha=$(uv run python -c 'import base64,hashlib; print(base64.b64encode(hashlib.sha256(open("package.zip", "rb").read()).digest()).decode())')
        actual_sha=$(aws lambda get-function --function-name "$FUNCTION_NAME" --region "$AWS_REGION" --query 'Configuration.CodeSha256' --output text)
        test "$expected_sha" = "$actual_sha"
        git rev-parse HEAD
        aws lambda get-function \
          --function-name "$FUNCTION_NAME" \
          --region "$AWS_REGION" \
          --query 'Configuration.LastModified' \
          --output text
        echo "Automator Lambda function updated successfully"

    - name: Verify real Slack question and answer
      if: github.event_name == 'workflow_dispatch' && inputs.live_proof
      env:
        PROOF_THREAD_TS: ${{ inputs.proof_thread_ts }}
      run: uv run python scripts/prove_cmp_slack.py
